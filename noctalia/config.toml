scale = 1.1000000000000001

[widget.clipboard]
enabled = false

[widget.clock]
capsule = true
capsule_opacity = 0.0
capsule_radius = 4
font_scale = 1.4199999999999999
font_weight = 700
scale = 1.3

[widget.control-center]
