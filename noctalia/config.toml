[bar.default]
auto_hide = false
capsule = true
concave_edge_corners = false
end = [ "tray", "network", "volume", "notifications", "battery", "session" ]
margin_ends = 0
padding = 9
position = "bottom"
radius = 0
reserve_space = true
scale = 0.95000000670552254
start = [ "control-center", "spacer_2", "launcher", "wallpaper", "workspaces" ]
thickness = 26
widget_spacing = 7

[desktop_widgets]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
polkit_agent = true

[theme]
builtin = "Catppuccin"
community_palette = "One Dark Two"
custom_palette = "Monocromo"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-fruit-salad"

[wallpaper]
directory = "/home/miyu/Descargas/mios"

    [wallpaper.default]
    path = "/home/miyu/Descargas/mios/1109233.jpg"

    [wallpaper.last]
    path = "/home/miyu/Descargas/mios/1109233.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/miyu/Descargas/mios/1109233.jpg"

[weather]
enabled = false

[widget.battery]
